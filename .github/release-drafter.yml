# Config for release-drafter/release-drafter, used two ways in this repo:
#
# 1. .github/workflows/autolabeler.yml runs the same action on every PR
#    event to apply the `autolabeler:` rules below to the PR itself.
# 2. .github/workflows/release.yml runs the action in dry-run mode on every
#    push to main purely to read its `resolved_version` output (computed
#    from `version-resolver:` below against the labels merged PRs already
#    carry) -- it never lets release-drafter create/update its own GitHub
#    Release or notes; this repo's own release.yml writes CHANGELOG.md and
#    the Release body itself, from `git log`, to avoid depending on
#    release-drafter's own PR-title interpolation for that step.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Matches this repo's actual PR title conventions (see PRs #84-#104):
# Conventional-Commits-style `type(scope): description` / `type: description`
# (e.g. "fix(reporting): ...", "chore: ...") and a plain-imperative fallback
# ("Fix ...", "Add ...") from before that convention was adopted.
#
# Deliberately no 'breaking'/'major' rule here, even a narrow, well-defined
# one (e.g. matching Conventional Commits' own `type!:` marker) -- a
# text-pattern match on a PR's own title/body is written by the PR author
# themselves and can trigger unintentionally (a real incident on another
# repo: a PR whose body merely *mentioned* the words "BREAKING CHANGE" as
# prose, describing a bug, got auto-labeled 'major' and would have shipped
# an unintended major version bump had it merged before a human caught it).
# A major-version bump (`version-resolver.major` below) must only ever be
# triggered by a human deliberately applying the 'breaking'/'major' label
# by hand, never by text a PR's own author wrote themselves.
autolabeler:
  - label: 'fix'
    title:
      - '/^fix(\([^)]*\))?:/i'
      - '/^Fix /'
  - label: 'feature'
    title:
      - '/^feat(\([^)]*\))?:/i'
      - '/^Add /'
  - label: 'chore'
    title:
      - '/^chore(\([^)]*\))?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\([^)]*\))?:/i'

# No label -> patch, per this repo's own default-safe convention.
version-resolver:
  major:
    labels:
      - 'breaking'
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'minor'
  patch:
    labels:
      - 'fix'
      - 'chore'
      - 'documentation'
      - 'patch'
  default: patch

template: |
  ## Changes

  $CHANGES
