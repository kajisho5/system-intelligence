[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "system-intelligence"
version = "0.2.0"
description = "A general-purpose AI system intelligence layer for discovering, understanding, auditing, researching, designing, improving, and verifying software systems."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "System Intelligence Contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.6,<3",
  "typer>=0.12,<1",
  "defusedxml>=0.7,<1",
]

[project.urls]
Homepage = "https://github.com/kajisho5/system-intelligence"
Issues = "https://github.com/kajisho5/system-intelligence/issues"

[project.scripts]
si = "system_intelligence.cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",
  "types-defusedxml>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/system_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Embedded CSS/JS string literals, not Python prose — wrapping them
# arbitrarily to fit 100 columns would hurt readability of the asset itself.
"src/system_intelligence/reporting/dashboard_html.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["system_intelligence"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=system_intelligence --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B404 (import subprocess) is purely informational; the one call site
# (cli/main.py) uses a fixed argv with no shell and is annotated inline.
skips = ["B404"]
